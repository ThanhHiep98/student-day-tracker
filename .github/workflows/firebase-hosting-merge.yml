# Initially generated by `firebase init hosting:github`, then extended with the
# pnpm build + quality gates (plans/2026-10-01-firebase-setup.html, task B2).
# Deploys the static export in `out/` to the live channel on every push to master.

name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm test --run

      # Security Rules + Firestore integration tests on the Auth/Firestore
      # emulators (project demo-sdt, no secrets). The emulators need Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - run: pnpm test:emulator

      - run: pnpm build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STUDENT_DAY_TRACKER }}
          channelId: live
          projectId: student-day-tracker
